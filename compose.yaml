services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: beauty
      POSTGRES_USER: beauty
      POSTGRES_PASSWORD: beauty
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beauty -d beauty"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - beauty_postgres_data:/var/lib/postgresql/data

volumes:
  beauty_postgres_data:
